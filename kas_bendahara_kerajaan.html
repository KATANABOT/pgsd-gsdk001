<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Bendahara Kerajaan - 01GSDK001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #030712; }
        .glass-card { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .royal-card { background: linear-gradient(135deg, rgba(20, 15, 35, 0.9) 0%, rgba(40, 25, 10, 0.85) 100%); border: 1px solid rgba(217, 119, 6, 0.4); }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100">

    <header class="glass-card border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-amber-400 cursor-pointer" onclick="navigateTo('index.html')">01GSDK001 - Kas Kerajaan</h1>
            <button onclick="navigateTo('index.html')" class="text-xs bg-amber-600 px-3 py-1.5 rounded-xl font-bold">← Beranda</button>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
        <div class="royal-card rounded-3xl p-6 space-y-4">
            <h2 class="text-2xl font-black text-amber-300"><i class="fa-solid fa-crown mr-2"></i>Keuangan Kas Kelas (Rp 5.000 / Kamis)</h2>
            <div class="grid grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="bg-slate-950/80 p-4 rounded-xl border border-amber-500/30">
                    <span class="text-xs text-amber-400 block">Total Kas Terkumpul</span>
                    <strong class="text-xl text-amber-300" id="kas-auto-collected">Rp 0</strong>
                </div>
                <div class="bg-slate-950/80 p-4 rounded-xl border border-amber-500/30">
                    <span class="text-xs text-amber-400 block">Saldo Kas Netto</span>
                    <strong class="text-xl text-amber-200" id="kas-net-balance">Rp 0</strong>
                </div>
            </div>
        </div>

        <div class="glass-card p-5 rounded-3xl space-y-4">
            <h3 class="font-bold text-white text-sm">Matriks Pembayaran Kas Kamis</h3>
            <div id="dues-tracker-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
        </div>
    </main>

    <script>
        function renderDuesGrid() {
            const grid = document.getElementById('dues-tracker-grid');
            if (!grid) return;
            grid.innerHTML = (window.studentsList || []).map((s, idx) => {
                const isPaid = window.paidDuesStudents.has(s);
                return `
                    <div onclick="toggleDueStatus('${s}')" class="p-3 rounded-xl border cursor-pointer flex justify-between items-center ${isPaid ? 'bg-amber-950/40 border-amber-500 text-amber-200' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                        <span class="text-xs font-bold uppercase truncate">${idx + 1}. ${s}</span>
                        <span class="text-[10px] font-black px-2 py-0.5 rounded ${isPaid ? 'bg-amber-500 text-slate-950' : 'bg-rose-500/20 text-rose-300'}">${isPaid ? 'LUNAS' : 'BELUM'}</span>
                    </div>
                `;
            }).join('');
        }

        function toggleDueStatus(name) {
            if (window.paidDuesStudents.has(name)) window.paidDuesStudents.delete(name);
            else window.paidDuesStudents.add(name);
            window.saveDataLocal();
            renderDuesGrid();
            calculateKas();
        }

        function calculateKas() {
            const collected = window.paidDuesStudents.size * 5000;
            document.getElementById('kas-auto-collected').textContent = 'Rp ' + collected.toLocaleString('id-ID');
            document.getElementById('kas-net-balance').textContent = 'Rp ' + collected.toLocaleString('id-ID');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderDuesGrid();
            calculateKas();
        });
    </script>
</body>
</html>
