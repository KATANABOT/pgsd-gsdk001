<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referensi - 01GSDK001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #030712; }
        .glass-card { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100">

    <header class="glass-card border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-yellow-400 cursor-pointer" onclick="navigateTo('index.html')">01GSDK001 - Referensi</h1>
            <button onclick="navigateTo('index.html')" class="text-xs bg-yellow-600 text-slate-950 px-3 py-1.5 rounded-xl font-bold">← Beranda</button>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
        <div class="border-b border-slate-800 pb-4">
            <h2 class="text-xl font-bold text-yellow-400"><i class="fa-solid fa-bookmark mr-2"></i>Sumber Belajar & Jurnal</h2>
        </div>

        <div id="referensi-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </main>

    <script>
        function renderReferensiList() {
            const container = document.getElementById('referensi-list-container');
            if (!container) return;
            container.innerHTML = (window.referensiList || []).map(r => `
                <div class="glass-card p-5 rounded-2xl space-y-2">
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-yellow-500/20 text-yellow-300 border border-yellow-500/30">${r.category}</span>
                    <h3 class="font-extrabold text-sm text-white">${r.title}</h3>
                    <a href="${r.link}" target="_blank" class="block text-xs text-yellow-400 hover:underline">Akses Referensi →</a>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderReferensiList();
        });
    </script>
</body>
</html>
