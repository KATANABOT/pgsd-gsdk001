<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Mahasiswa - 01GSDK001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #030712; }
        .glass-card { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100">

    <header class="glass-card border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-white cursor-pointer" onclick="navigateTo('index.html')">01GSDK001 - PGSD</h1>
            <button onclick="navigateTo('index.html')" class="text-xs bg-amber-600 px-3 py-1.5 rounded-xl font-bold">← Beranda</button>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h2 class="text-xl font-bold text-amber-400"><i class="fa-solid fa-pen-to-square mr-2"></i>Tugas Mahasiswa</h2>
            <button onclick="openModal('add-tugas-modal')" class="px-3.5 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs">+ Tambah Tugas</button>
        </div>

        <div id="tugas-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </main>

    <!-- MODAL ADD TUGAS -->
    <div id="add-tugas-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-6 max-w-md w-full space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-amber-400">Tambah Tugas Baru</h3>
                <button onclick="closeModal('add-tugas-modal')" class="text-slate-400">✕</button>
            </div>
            <form onsubmit="handleSaveTugas(event)" class="space-y-3">
                <input type="text" id="tugas-title-input" required placeholder="Judul / Instruksi Tugas" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                <input type="text" id="tugas-matkul-input" placeholder="Mata Kuliah" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                <input type="text" id="tugas-deadline-input" required placeholder="Deadline (Contoh: Kamis, 23:59 WIB)" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                <button type="submit" class="w-full py-2.5 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs">Simpan Tugas</button>
            </form>
        </div>
    </div>

    <script>
        function renderTugasList() {
            const container = document.getElementById('tugas-list-container');
            if (!container) return;
            container.innerHTML = (window.tugasList || []).map(t => `
                <div class="glass-card p-5 rounded-2xl space-y-2">
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">${t.matkul}</span>
                    <h3 class="font-bold text-sm text-white">${t.title}</h3>
                    <p class="text-xs text-slate-400">Deadline: ${t.deadline}</p>
                </div>
            `).join('');
        }

        function handleSaveTugas(e) {
            e.preventDefault();
            const title = document.getElementById('tugas-title-input').value;
            const matkul = document.getElementById('tugas-matkul-input').value || 'Umum';
            const deadline = document.getElementById('tugas-deadline-input').value;
            window.tugasList.unshift({ id: Date.now().toString(), title, matkul, deadline });
            window.saveDataLocal();
            renderTugasList();
            closeModal('add-tugas-modal');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTugasList();
        });
    </script>
</body>
</html>
