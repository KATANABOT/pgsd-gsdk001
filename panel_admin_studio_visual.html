<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - 01GSDK001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #030712; }
        .glass-card { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100">

    <header class="glass-card border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-amber-400 cursor-pointer" onclick="navigateTo('index.html')">01GSDK001 - Panel Admin</h1>
            <button onclick="navigateTo('index.html')" class="text-xs bg-amber-600 text-slate-950 px-3 py-1.5 rounded-xl font-bold">← Beranda</button>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
        <div class="border-b border-slate-800 pb-4">
            <h2 class="text-xl font-bold text-amber-400"><i class="fa-solid fa-shield-halved mr-2"></i>Panel Admin Studio</h2>
        </div>

        <div class="glass-card p-6 rounded-3xl space-y-4">
            <h3 class="font-bold text-white text-sm">Visual Config & Title Editor</h3>
            <form onsubmit="handleSaveVisual(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Judul Hero Portal</label>
                    <input type="text" id="cfg-hero-title-in" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Deskripsi Hero</label>
                    <textarea id="cfg-hero-sub-in" rows="2" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white"></textarea>
                </div>
                <button type="submit" class="py-2.5 px-4 bg-purple-600 font-bold text-white rounded-xl text-xs">Simpan Config</button>
            </form>
        </div>
    </main>

    <script>
        function handleSaveVisual(e) {
            e.preventDefault();
            const title = document.getElementById('cfg-hero-title-in').value;
            const sub = document.getElementById('cfg-hero-sub-in').value;
            if (title) window.siteConfig.heroTitle = title;
            if (sub) window.siteConfig.heroSubtitle = sub;
            window.saveDataLocal();
            alert('Config visual tersimpan!');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.siteConfig) {
                document.getElementById('cfg-hero-title-in').value = window.siteConfig.heroTitle;
                document.getElementById('cfg-hero-sub-in').value = window.siteConfig.heroSubtitle;
            }
        });
    </script>
</body>
</html>
