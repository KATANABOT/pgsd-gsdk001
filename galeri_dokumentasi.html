<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokumentasi - 01GSDK001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #030712; }
        .glass-card { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100">

    <header class="glass-card border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-blue-400 cursor-pointer" onclick="navigateTo('index.html')">01GSDK001 - Dokumentasi</h1>
            <button onclick="navigateTo('index.html')" class="text-xs bg-blue-600 px-3 py-1.5 rounded-xl font-bold">← Beranda</button>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
        <div class="border-b border-slate-800 pb-4">
            <h2 class="text-xl font-bold text-blue-400"><i class="fa-solid fa-camera mr-2"></i>Galeri Dokumentasi Foto & Video</h2>
        </div>

        <div id="gallery-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5"></div>
    </main>

    <script>
        function renderGallery() {
            const container = document.getElementById('gallery-container');
            if (!container) return;
            container.innerHTML = (window.galleryPhotos || []).map(p => `
                <div class="glass-card rounded-2xl overflow-hidden">
                    <img src="${p.url}" class="w-full h-40 object-cover">
                    <div class="p-3">
                        <h4 class="font-bold text-xs text-white">${p.title}</h4>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();
        });
    </script>
</body>
</html>
