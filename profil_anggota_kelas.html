<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil & Anggota Kelas - 01GSDK001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #030712; }
        .glass-card { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100">

    <header class="glass-card border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-white cursor-pointer" onclick="navigateTo('index.html')">01GSDK001 - PGSD</h1>
            <button onclick="navigateTo('index.html')" class="text-xs bg-cyan-600 px-3 py-1.5 rounded-xl font-bold">← Beranda</button>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
        <div class="border-b border-slate-800 pb-4">
            <h2 class="text-xl font-bold text-cyan-400"><i class="fa-solid fa-user-graduate mr-2"></i>Profil & Anggota Kelas</h2>
        </div>

        <div class="glass-card p-5 rounded-3xl space-y-4">
            <h3 class="font-bold text-white text-sm">Daftar Mahasiswa/i PGSD CK</h3>
            <div id="student-cards-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
        </div>
    </main>

    <script>
        function renderStudentCards() {
            const container = document.getElementById('student-cards-container');
            if (!container) return;
            container.innerHTML = (window.studentsList || []).map((s, idx) => `
                <div class="p-3 bg-slate-900 border border-slate-800 rounded-xl flex items-center gap-3">
                    <span class="w-7 h-7 rounded-full bg-purple-900 text-purple-200 text-xs flex items-center justify-center font-bold">${idx + 1}</span>
                    <span class="text-xs font-bold uppercase text-white truncate">${s}</span>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderStudentCards();
        });
    </script>
</body>
</html>
