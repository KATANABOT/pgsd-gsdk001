<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Perkuliahan - 01GSDK001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #030712; }
        .glass-card { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100">

    <header class="glass-card border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-white cursor-pointer" onclick="navigateTo('index.html')">01GSDK001 - PGSD</h1>
            <button onclick="navigateTo('index.html')" class="text-xs bg-purple-600 px-3 py-1.5 rounded-xl font-bold">← Beranda</button>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h2 class="text-xl font-bold text-emerald-400"><i class="fa-solid fa-book-open mr-2"></i>Materi & Modul Perkuliahan</h2>
            <button onclick="openModal('add-materi-modal')" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs">+ Tambah Modul</button>
        </div>

        <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </main>

    <!-- MODAL ADD MATERI -->
    <div id="add-materi-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-6 max-w-md w-full space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-white">Tambah Modul Materi</h3>
                <button onclick="closeModal('add-materi-modal')" class="text-slate-400">✕</button>
            </div>
            <form onsubmit="handleSaveMateri(event)" class="space-y-3">
                <input type="text" id="materi-title-input" required placeholder="Judul Modul/Mata Kuliah" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                <input type="text" id="materi-dosen-input" placeholder="Nama Dosen" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                <input type="text" id="materi-link-input" placeholder="Link URL File PDF/Drive" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                <button type="submit" class="w-full py-2.5 bg-emerald-600 font-bold rounded-xl text-xs">Simpan Modul</button>
            </form>
        </div>
    </div>

    <script>
        function renderCoursesGrid() {
            const grid = document.getElementById('courses-grid');
            if (!grid) return;
            grid.innerHTML = (window.coursesData || []).map(c => `
                <div class="glass-card p-5 rounded-2xl space-y-2">
                    <h3 class="font-extrabold text-sm text-white">${c.name}</h3>
                    <p class="text-xs text-slate-400">Dosen: ${c.dosen}</p>
                    ${c.link ? `<a href="${c.link}" target="_blank" class="block mt-2 text-xs text-emerald-400 hover:underline">Buka Link Modul →</a>` : ''}
                </div>
            `).join('');
        }

        function handleSaveMateri(e) {
            e.preventDefault();
            const name = document.getElementById('materi-title-input').value;
            const dosen = document.getElementById('materi-dosen-input').value || 'Dosen';
            const link = document.getElementById('materi-link-input').value;
            window.coursesData.push({ id: Date.now(), name, dosen, link, sks: 2, day: 'Kamis', code: '01GSDK001' });
            window.saveDataLocal();
            renderCoursesGrid();
            closeModal('add-materi-modal');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCoursesGrid();
        });
    </script>
</body>
</html>
